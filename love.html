<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Valentine ❤️</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<audio id="bgMusic" loop>
  <source src="audio/Sheeran.mp3" type="audio/mp3">
</audio>

<div class="container">
  <h1 class="name">My Valentine 💖 <span>SANIKA</span></h1>
  <p class="subtitle">To the most beautiful part of my life</p>

  <!-- MAGIC BUTTON -->
  <button id="magicBtn" onclick="startLove()">Click for Magic ✨</button>

  <!-- MESSAGE (HIDDEN BY DEFAULT) -->
  <div class="letter magic-content">
    <p>
      My love ❤️<br><br>
      Every smile of yours feels like home.<br>
      Every moment with you feels special.<br>
      I don’t need a perfect world,<br>
      because <b>you</b> are already perfect for me.
      <br><br>
      Will you be my Valentine today and forever? 💌
    </p>
  </div>

  <!-- PHOTOS (HIDDEN BY DEFAULT) -->
  <div class="gallery magic-content">
    <img src="images/one.jpeg" alt="Memory 1">
    <img src="images/two.jpeg" alt="Memory 2">
    <img src="images/three.jpeg" alt="Memory 3">
  </div>

  <h2 class="ending magic-content">
    I Love You Always 💞
  </h2>
</div>

<script src="js/script.js"></script>
</body>
</html>
